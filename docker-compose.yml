version: '3.8'

services:
  trading-bot:
    build: .
    container_name: trading_bot_v5
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data_cache:/app/data_cache
      - ./state:/app/state
    depends_on:
      - mt5-terminal
    
  mt5-terminal:
    image: davidalber/headless-metatrader5:latest
    container_name: mt5_terminal
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DISPLAY=:99
    volumes:
      - mt5_data:/home/mt5

volumes:
  mt5_data:
  pgdata:

  postgres:
    image: postgres:15-alpine
    container_name: db_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: trading_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cache_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
