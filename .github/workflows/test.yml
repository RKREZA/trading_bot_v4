name: Trading Bot V3 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and integration tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q

      - name: Backtest module smoke import
        env:
          PYTHONPATH: .
        run: |
          python -c "import backtest; import backtesting.backtester; print('smoke_ok')"
