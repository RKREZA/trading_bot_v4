name: V5-INSIGNIA Institutional CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Institutional Test Suite
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov scipy

      - name: Run full institutional test suite
        env:
          TELEGRAM_BOT_TOKEN: "ci_mock_token"
          TELEGRAM_CHAT_ID: "ci_mock_chat"
          NVIDIA_API_KEY: ""
        run: |
          pytest tests/ -v --tb=short --co -q 2>&1 | head -50
          pytest tests/ -v --tb=long --cov=core --cov=backtesting --cov-report=term-missing

      - name: Run critical path tests (fast gate)
        run: |
          pytest tests/test_risk_guardian.py tests/test_order_manager.py tests/test_backtester_core.py -v --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7
